<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="#{profile.title}">Profile - Your Orders and Balance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<div class="container mt-5">
    <h1>
        <span th:text="#{profile.welcome}">Welcome</span>, <span th:text="${client.name}">Client Name</span>!
    </h1>

    <div class="mb-4">
        <h3 th:text="#{profile.balance}">Your Balance:</h3>
        <p class="fs-4 text-success" th:text="${client.balance} + ' ₴'">0.00 ₴</p>
    </div>

    <form th:action="@{/profile/balance}" method="post" class="mb-5">
        <div class="mb-3">
            <label for="newBalance" class="form-label" th:text="#{profile.topup}">Top up your balance</label>
            <input type="number" step="0.01" min="0" class="form-control" id="newBalance" name="newBalance"
                   th:value="${newBalance}" th:placeholder="#{profile.topup.placeholder}" required>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{profile.updateBalance}">Update Balance</button>
    </form>

    <h2 th:text="#{profile.orders}">Your Orders</h2>
    <div th:if="${#lists.isEmpty(orders)}">
        <p th:text="#{profile.noOrders}">You have no orders yet.</p>
        <a href="/catalog" class="btn btn-secondary" th:text="#{profile.goToCatalog}">Go to Catalog</a>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}">
        <table class="table table-bordered table-hover">
            <thead class="table-light">
            <tr>
                <th th:text="#{order.id}">Order ID</th>
                <th th:text="#{order.date}">Date</th>
                <th th:text="#{order.amount}">Amount</th>
                <th th:text="#{order.status}">Status</th>
                <th th:text="#{order.details}">Details</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">1</td>
                <td th:text="${#temporals.format(order.orderDateTime, 'dd-MM-yyyy HH:mm')}">01-01-2025 12:00</td>
                <td th:text="${order.amount} + ' ₴'">1000 ₴</td>
                <td th:text="${order.approved ? #{order.status.approved} : #{order.status.pending}}">Pending</td>
                <td>
                    <a th:href="@{/details/{id}(id=${order.id})}" class="btn btn-sm btn-info" th:text="#{order.view}">View</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="mt-5 text-center">
    <a th:href="@{/profile(lang='en')}" class="me-2">🌍 English</a>
    <a th:href="@{/profile(lang='uk')}">Українська</a>
</div>

<div th:insert="~{footer::footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
