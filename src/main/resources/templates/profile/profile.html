<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="#{profile.title}">Profile - Your Orders and Balance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/css/custom-style.css" rel="stylesheet" />
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<div class="container mt-5">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="#{${success}}">Success message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="#{${error}}">Error message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <h1>
        <span th:text="#{profile.welcome}">Welcome</span>, <span th:text="${client.name}">Client Name</span>!
    </h1>

    <div class="mb-4">
        <h3 th:text="#{profile.balance}">Your Balance:</h3>
        <p class="fs-4 text-success" th:text="${client.balance} + ' ₴'">0.00 ₴</p>
    </div>

    <!-- Top up balance -->
    <form th:action="@{/profile/balance}" method="post" class="mb-5">
        <div class="mb-3">
            <label for="newBalance" class="form-label" th:text="#{profile.topup}">Top up your balance</label>
            <input type="number" step="0.01" min="0" class="form-control" id="newBalance" name="newBalance"
                   th:value="${newBalance}" th:placeholder="#{profile.topup.placeholder}" required>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{profile.updateBalance}">Update Balance</button>
    </form>

    <!-- Email update -->
    <form th:action="@{/profile/change-email}" method="post" class="mb-4">
        <h4 th:text="#{profile.changeEmail}">Change Email</h4>
        <div class="mb-3">
            <label for="currentEmail" class="form-label" th:text="#{profile.currentEmail}">Current Email</label>
            <input type="email" class="form-control" id="currentEmail" name="currentEmail" required>
        </div>
        <div class="mb-3">
            <label for="newEmail" class="form-label" th:text="#{profile.newEmail}">New Email</label>
            <input type="email" class="form-control" id="newEmail" name="newEmail" required>
        </div>
        <button type="submit" class="btn btn-warning" th:text="#{profile.updateEmail}">Update Email</button>
    </form>

    <!-- Password update -->
    <form th:action="@{/profile/change-password}" method="post">
        <h4 th:text="#{profile.changePassword}">Change Password</h4>
        <div class="mb-3">
            <label for="oldPassword" class="form-label" th:text="#{profile.oldPassword}">Old Password</label>
            <input type="password" class="form-control" id="oldPassword" name="oldPassword" required>
        </div>
        <div class="mb-3">
            <label for="newPassword" class="form-label" th:text="#{profile.newPassword}">New Password</label>
            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
        </div>
        <button type="submit" class="btn btn-danger" th:text="#{profile.updatePassword}">Update Password</button>
    </form>

    <!-- Orders -->
    <h2 class="mt-5" th:text="#{profile.orders}">Your Orders</h2>

    <div th:if="${#lists.isEmpty(orders)}">
        <p th:text="#{profile.noOrders}">You have no orders yet.</p>
        <a href="/catalog" class="btn btn-secondary" th:text="#{profile.goToCatalog}">Go to Catalog</a>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}">
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                <tr>
                    <th th:text="#{order.id}">Order ID</th>
                    <th th:text="#{order.date}">Date</th>
                    <th th:text="#{order.amount}">Amount</th>
                    <th th:text="#{order.status}">Status</th>
                    <th th:text="#{order.operations}">Actions</th>
                    <th th:text="#{order.details}">Details</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}">1</td>
                    <td th:text="${#temporals.format(order.orderDateTime, 'dd-MM-yyyy HH:mm')}">01-01-2025 12:00</td>
                    <td th:text="${order.amount} + ' ₴'">1000 ₴</td>
                    <td>
                        <span th:if="${order.approved}" th:text="#{order.status.approved}">Approved</span>
                        <span th:unless="${order.approved}" th:text="#{order.status.pending}">Pending</span>
                    </td>
                    <td>
                        <a th:href="@{/orders/edit/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary me-2">
                            <i class="bi bi-pencil-square"></i> <span th:text="#{order.edit}">Edit</span>
                        </a>
                        <a th:href="@{/orders/delete/{id}(id=${order.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Are you sure you want to cancel this order?');">
                            <i class="bi bi-trash3"></i> <span th:text="#{order.cancel}">Cancel</span>
                        </a>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-info"
                                data-bs-toggle="modal"
                                data-bs-target="#orderDetailsModal"
                                th:onclick="'loadOrderDetails(' + ${order.id} + ')'">
                            <i class="bi bi-eye"></i> <span th:text="#{order.view}">View</span>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal window -->
<div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" th:text="#{orders.details.header}">Order Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="orderDetailsContent">
                <!-- AJAX content here -->
            </div>
        </div>
    </div>
</div>

<!-- Language Switch -->
<div class="mt-5 text-center">
    <a th:href="@{/profile(lang='en')}" class="me-2">🌍 English</a>
    <a th:href="@{/profile(lang='uk')}">Українська</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function loadOrderDetails(orderId) {
        fetch('/orders/details/' + orderId)
            .then(response => response.text())
            .then(html => {
                document.getElementById('orderDetailsContent').innerHTML = html;
            });
    }
</script>
</body>
</html>
