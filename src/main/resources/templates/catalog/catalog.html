<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{catalog.title}">Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f9fafb;
        }
        .card {
            transition: box-shadow 0.3s ease-in-out;
        }
        .card:hover {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
<header th:insert="~{menunavy::navy}"></header>


<div class="container py-5">
    <h2 class="mb-4 text-primary"><i class="bi bi-grid"></i> <span th:text="#{catalog.title}">Catalog</span></h2>

    <form method="get" class="mb-4" id="filterForm">
        <div class="col-md-4">
            <input type="text" class="form-control" name="name" th:value="${searchName}" placeholder=""/>
        </div>
        <div class="row g-3">
            <div class="col-md-4">
                <select name="type" class="form-select" id="typeSelect">
                    <option value="" th:selected="${selectedType == null}" th:text="#{catalog.allTypes}">All Types</option>
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${t == selectedType}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <select name="sort" class="form-select" id="sortSelect">
                    <option value="price" th:selected="${sort == 'price'}" th:text="#{catalog.sortByPrice}">Sort by price</option>
                    <option value="name" th:selected="${sort == 'name'}" th:text="#{catalog.sortByName}">Sort by name</option>
                </select>
            </div>
            <div class="col-md-3">
                <select name="dir" class="form-select" id="dirSelect">
                    <option value="asc" th:selected="${dir == 'asc'}" th:text="#{catalog.ascending}">Ascending</option>
                    <option value="desc" th:selected="${dir == 'desc'}" th:text="#{catalog.descending}">Descending</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-funnel"></i> <span th:text="#{catalog.apply}">Apply</span>
                </button>
            </div>
        </div>
    </form>

    <div class="row row-cols-1 row-cols-md-3 g-4" id="appliance-container" th:fragment="applianceCards">
        <div class="col" th:each="appliance : ${appliances}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title text-primary" th:text="${appliance.name}">Name</h5>
                    <p class="card-text mb-1"><strong th:text="#{catalog.model} + ':'">Model:</strong> <span th:text="${appliance.model}">Model</span></p>
                    <p class="card-text mb-1"><strong th:text="#{catalog.price} + ':'">Price:</strong> $<span th:text="${appliance.price}">Price</span></p>
                    <p class="card-text mb-2"><strong th:text="#{catalog.type} + ':'">Type:</strong> <span th:text="${appliance.type}">Type</span></p>
                    <a th:href="@{/catalog/appliances/{id}(id=${appliance.id})}" class="btn btn-outline-primary btn-sm w-100">
                        <i class="bi bi-eye"></i> <span th:text="#{catalog.viewDetails}">View details</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-5">
        <button id="loadMoreBtn" class="btn btn-secondary px-5 py-2">
            <i class="bi bi-plus-circle"></i> <span th:text="#{catalog.loadMore}">Load more</span>
        </button>
    </div>
</div>
<div class="mt-5 text-center">
    <a th:href="@{/catalog(lang='en')}" class="me-2">🌍 English</a>
    <a th:href="@{/catalog(lang='uk')}">Українська</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let page = 1;

    document.getElementById('loadMoreBtn').addEventListener('click', function () {
        const type = document.getElementById('typeSelect').value;
        const sort = document.getElementById('sortSelect').value;
        const dir = document.getElementById('dirSelect').value;

        fetch(`/catalog/load?page=${page}&type=${type}&sort=${sort}&dir=${dir}`)
            .then(response => response.text())
            .then(html => {
                if (html.trim().length === 0) {
                    document.getElementById('loadMoreBtn').disabled = true;
                    document.getElementById('loadMoreBtn').innerText = "No more products";
                    return;
                }

                const temp = document.createElement('div');
                temp.innerHTML = html;

                const newCards = temp.querySelectorAll('.col');
                newCards.forEach(card => {
                    document.getElementById('appliance-container').appendChild(card);
                });

                page++;
            });
    });
</script>
</body>
</html>
