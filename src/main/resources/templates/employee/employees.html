<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/css/custom-style.css" rel="stylesheet" />
    <title>Employees list</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<h1 th:text="#{employee.header.list}">Employees</h1>
<form method="get" action="#" class="row g-2 mb-3">
    <div class="col-md-2">
        <input type="number" class="form-control" name="id" th:value="${searchId}" placeholder="ID">
    </div>
    <div class="col-md-3">
        <input type="text" class="form-control" name="name" th:value="${searchName}" placeholder="Name">
    </div>
    <div class="col-md-3">
        <input type="text" class="form-control" name="department" th:value="${searchDepartment}" placeholder="Department">
    </div>
    <div class="col-md-2">
        <select name="sortBy" class="form-select">
            <option value="id" th:selected="${currentSort == 'id'}" th:text="#{object.user.id}">ID</option>
            <option value="name" th:selected="${currentSort == 'name'}" th:text="#{object.user.name}">Name</option>
            <option value="department" th:selected="${currentSort == 'department'}" th:text="#{object.employee.department}">Department</option>
        </select>
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">
            <i class="fa fa-search"></i> <span th:text="#{btn.search}">Search</span>
        </button>
    </div>
</form>
<table class="table table-hover">
    <thead>
    <tr class="table-dark">
        <th th:text="#{object.user.id}">ID</th>
        <th th:text="#{object.user.name}">Name</th>
        <th th:text="#{object.user.email}">Email</th>
        <th th:text="#{object.user.password}">Password</th>
        <th th:text="#{object.employee.department}">Department</th>
        <th>Operation</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}"></td>
        <td th:text="${employee.name}"></td>
        <td th:text="${employee.email}"></td>
        <td th:text="${employee.password}"></td>
        <td th:text="${employee.department}"></td>
        <td>
            <a th:href="@{/employees/{id}/edit(id=${employee.id})}" class="btn btn-sm btn-warning" title="Edit">
                <i class="fa fa-edit"></i>
            </a>
            <a th:href="@{/employees/{id}/delete(id=${employee.id})}" class="btn btn-sm btn-danger" title="Delete"
               onclick="return confirm('Are you sure you want to delete this employee?');">
                <i class="fa fa-minus"></i>
            </a>
        </td>
    </tr>
    </tbody>
</table>
<a th:href="@{/employees/add}" class="btn btn-primary" th:text="#{employee.btn.new}">New employee</a>
<div th:insert="~{footer::footer}"></div>
<p>
    <a th:href="@{/employees(lang='en')}">English</a>
    <a th:href="@{/employees(lang='uk')}">Українська</a>
</p>
</body>
</html>
