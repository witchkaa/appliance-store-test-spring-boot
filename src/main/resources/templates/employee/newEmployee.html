<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{employee.btn.new}">New Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/custom-style.css" rel="stylesheet" />
</head>
<body>

<!-- Navigation -->
<div th:insert="~{menunavy::navy}"></div>

<!-- Main container -->
<div class="container mt-5">
    <h2 class="mb-4 text-primary" th:text="#{employee.btn.new}">New Employee</h2>

    <form th:action="@{/employees/add-employee}" th:object="${employee}" method="post" class="row g-3">

        <!-- Name -->
        <div class="col-md-6">
            <label class="form-label" th:for="*{name}" th:text="#{object.user.name}">Name</label>
            <input type="text" th:field="*{name}" class="form-control" placeholder="John Doe">
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:text="#{user.name.is.mandatory}"></div>
        </div>

        <!-- Email -->
        <div class="col-md-6">
            <label class="form-label" th:for="*{email}" th:text="#{object.user.email}">Email</label>
            <input type="email" th:field="*{email}" class="form-control" placeholder="john@example.com">
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:text="#{user.email.is.correctly}"></div>
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:text="#{user.email.is.blank}"></div>
        </div>

        <!-- Password -->
        <div class="col-md-6">
            <label class="form-label" th:for="*{password}" th:text="#{object.user.password}">Password</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••">
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:text="#{user.password.is.correctly}"></div>
        </div>

        <!-- Department -->
        <div class="col-md-6">
            <label class="form-label" th:for="*{department}" th:text="#{object.employee.department}">Department</label>
            <input type="text" th:field="*{department}" class="form-control" placeholder="HR, Sales...">
            <div class="text-danger" th:if="${#fields.hasErrors('department')}">Invalid department</div>
        </div>

        <!-- Buttons -->
        <div class="col-12 text-end mt-4">
            <button type="submit" class="btn btn-success me-2">
                <i class="bi bi-person-plus"></i> <span th:text="#{btn.submit}">Submit</span>
            </button>
            <button type="reset" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-counterclockwise"></i> Reset
            </button>
        </div>
    </form>

    <!-- Language switch -->
    <div class="mt-4">
        <a th:href="@{/employees/add(lang='en')}" class="me-3">English</a>
        <a th:href="@{/employees/add(lang='uk')}">Українська</a>
    </div>
</div>

<!-- Footer -->
<div th:insert="~{footer::footer}"></div>

</body>
</html>
