<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Edit Employee</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<h1>Edit Employee</h1>

<form th:action="@{/employees/{id}/edit(id=${employee.id})}" th:object="${employee}" method="post">
    <p>
        <label th:text="#{object.user.name}">Name</label>
        <input type="text" th:field="*{name}" />
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></div>
    </p>
    <p>
        <label th:text="#{object.user.email}">Email</label>
        <input type="text" th:field="*{email}" />
    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></div>
    </p>
    <p>
        <label th:text="#{object.user.password}">Password</label>
        <input type="text" th:field="*{password}" placeholder="(leave empty to keep old password)" />
    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></div>
    </p>
    <p>
        <label th:text="#{object.employee.department}">Department</label>
        <input type="text" th:field="*{department}" />
    <div th:if="${#fields.hasErrors('department')}" th:errors="*{department}" class="text-danger"></div>
    </p>
    <button type="submit" class="btn btn-success" th:text="#{btn.submit}">Submit</button>
</form>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
