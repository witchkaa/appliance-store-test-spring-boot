<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/custom-style.css" rel="stylesheet" />
</head>
<body>

<!-- Navigation -->
<div th:insert="~{menunavy::navy}"></div>

<!-- Main container -->
<div class="container mt-5">
    <h2 class="mb-4 text-primary" th:text="#{employee.btn.edit}">Edit Employee</h2>

    <form th:action="@{/employees/{id}/edit(id=${employee.id})}" th:object="${employee}" method="post" class="row g-3">

        <!-- Name -->
        <div class="col-md-6">
            <label class="form-label" th:for="*{name}" th:text="#{object.user.name}">Name</label>
            <input type="text" th:field="*{name}" class="form-control" placeholder="John Smith">
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <!-- Email -->
        <div class="col-md-6">
            <label class="form-label" th:for="*{email}" th:text="#{object.user.email}">Email</label>
            <input type="email" th:field="*{email}" class="form-control" placeholder="john@example.com">
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <!-- Password -->
        <div class="col-md-6">
            <label class="form-label" th:for="*{password}" th:text="#{object.user.password}">Password</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="(leave empty to keep current)">
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <!-- Department -->
        <div class="col-md-6">
            <label class="form-label" th:for="*{department}" th:text="#{object.employee.department}">Department</label>
            <input type="text" th:field="*{department}" class="form-control" placeholder="HR, Sales...">
            <div class="text-danger" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
        </div>

        <!-- Buttons -->
        <div class="col-12 text-end mt-4">
            <button type="submit" class="btn btn-success me-2">
                <i class="bi bi-save"></i> <span th:text="#{btn.submit}">Submit</span>
            </button>
            <a th:href="@{/employees}" class="btn btn-secondary">
                <i class="bi bi-arrow-left-circle"></i> Back
            </a>
        </div>
    </form>
</div>

<!-- Footer -->
<div th:insert="~{footer::footer}"></div>

</body>
</html>
