<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appliances</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

<!-- Навигация -->
<div th:insert="~{menunavy::navy}"></div>

<div class="container mt-5">
    <!-- Заголовок -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>
            <i class="bi bi-list-ul"></i> <span th:text="#{appliance.header.list}">Appliances List</span>
        </h2>
        <a th:href="@{/appliances/add}" class="btn btn-primary" th:text="#{appliance.btn.new}">New appliance</a>
    </div>

    <!-- Таблица в карточке -->
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover table-bordered mb-0">
                <thead class="table-primary text-center align-middle">
                <tr>
                    <th th:text="#{object.appliance.id}">ID</th>
                    <th th:text="#{object.appliance.name}">Name</th>
                    <th th:text="#{object.appliance.category}">Category</th>
                    <th th:text="#{object.appliance.model}">Model</th>
                    <th th:text="#{object.appliance.manufacturer}">Manufacturer</th>
                    <th th:text="#{object.appliance.powerType}">Power Type</th>
                    <th th:text="#{object.appliance.characteristic}">Characteristic</th>
                    <th th:text="#{object.appliance.description}">Description</th>
                    <th th:text="#{object.appliance.power}">Power</th>
                    <th th:text="#{object.appliance.price}">Price</th>
                    <th th:text="#{object.appliance.type}">Type</th>
                    <th th:text="#{operation}">Operation</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appliance : ${appliances}">
                    <td th:text="${appliance.id}"></td>
                    <td th:text="${appliance.name}"></td>
                    <td th:text="${appliance.category}"></td>
                    <td th:text="${appliance.model}"></td>
                    <td th:text="${appliance.manufacturer.name}"></td>
                    <td th:text="${appliance.powerType}"></td>
                    <td th:text="${appliance.characteristic}"></td>
                    <td th:text="${appliance.description}"></td>
                    <td th:text="${appliance.power}"></td>
                    <td th:text="${appliance.price}"></td>
                    <td th:text="${appliance.type}"></td>
                    <td class="text-nowrap">
                        <a th:href="@{/appliances/{id}/edit(id=${appliance.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <a th:href="@{/appliances/{id}/delete(id=${appliance.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Языки -->
    <div class="mt-4 text-end">
        <a class="btn btn-sm btn-outline-secondary me-2" th:href="@{/appliances(lang='en')}">English</a>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/appliances(lang='uk')}">Українська</a>
    </div>
</div>

<!-- Футер -->
<div th:insert="~{footer::footer}"></div>

<!-- Bootstrap JS (если используешь dropdowns и другие компоненты) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
