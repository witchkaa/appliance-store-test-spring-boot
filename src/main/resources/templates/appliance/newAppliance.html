<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{appliance.form.title}">Add Appliance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<header th:insert="~{menunavy::navy}"></header>

<div class="container py-5">
    <h2 class="mb-4 text-primary" th:text="#{appliance.form.header}">Add New Appliance</h2>

    <form th:action="@{/appliances/add-appliance}" th:object="${appliance}" method="post" class="row g-3">

        <!-- Name -->
        <div class="col-md-6">
            <label th:for="*{name}" th:text="#{object.appliance.name}" class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <!-- Category -->
        <div class="col-md-6">
            <label th:for="*{category}" th:text="#{object.appliance.category}" class="form-label">Category</label>
            <select th:field="*{category}" class="form-select">
                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>

        <!-- Model -->
        <div class="col-md-6">
            <label th:for="*{model}" th:text="#{object.appliance.model}" class="form-label">Model</label>
            <input type="text" th:field="*{model}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></div>
        </div>

        <!-- Manufacturer -->
        <div class="col-md-6">
            <label th:for="*{manufacturer}" th:text="#{object.appliance.manufacturer}" class="form-label">Manufacturer</label>
            <select th:field="*{manufacturer}" class="form-select">
                <option th:each="m : ${manufacturers}" th:value="${m.id}" th:text="${m.name}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('manufacturer')}" th:errors="*{manufacturer}"></div>
        </div>

        <!-- Power Type -->
        <div class="col-md-6">
            <label th:for="*{powerType}" th:text="#{object.appliance.powerType}" class="form-label">Power Type</label>
            <select th:field="*{powerType}" class="form-select">
                <option th:each="p : ${powerTypes}" th:value="${p}" th:text="${p}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('powerType')}" th:errors="*{powerType}"></div>
        </div>

        <!-- Characteristic -->
        <div class="col-md-6">
            <label th:for="*{characteristic}" th:text="#{object.appliance.characteristic}" class="form-label">Characteristic</label>
            <input type="text" th:field="*{characteristic}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('characteristic')}" th:errors="*{characteristic}"></div>
        </div>

        <!-- Description -->
        <div class="col-md-12">
            <label th:for="*{description}" th:text="#{object.appliance.description}" class="form-label">Description</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <!-- Power -->
        <div class="col-md-6">
            <label th:for="*{power}" th:text="#{object.appliance.power}" class="form-label">Power (W)</label>
            <input type="number" th:field="*{power}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('power')}" th:errors="*{power}"></div>
        </div>

        <!-- Price -->
        <div class="col-md-6">
            <label th:for="*{price}" th:text="#{object.appliance.price}" class="form-label">Price ($)</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>
        <!-- Quantity In Stock -->
        <div class="col-md-6">
            <label th:for="*{quantityInStock}" th:text="#{object.appliance.quantity}" class="form-label">Quantity in Stock</label>
            <input type="number" min="0" th:field="*{quantityInStock}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('quantityInStock')}" th:errors="*{quantityInStock}"></div>
        </div>
        <!-- Type -->
        <div class="col-md-6">
            <label th:for="*{type}" th:text="#{object.appliance.type}" class="form-label">Type</label>
            <select th:field="*{type}" class="form-select">
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
        </div>

        <!-- Submit -->
        <div class="col-12 text-end">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i>
                <span th:text="#{btn.submit}">Submit</span>
            </button>
        </div>
    </form>
</div>
</body>
</html>
