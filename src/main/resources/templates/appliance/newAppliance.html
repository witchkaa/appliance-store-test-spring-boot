<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Appliance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<h1 th:text="#{appliance.btn.new}">New Appliance</h1>

<form th:action="@{/appliances/add-appliance}" th:object="${appliance}" method="post">
    <div>
        <label th:text="#{object.appliance.name}"></label>
        <input type="text" th:field="*{name}" />
    </div>
    <div>
        <label th:text="#{object.appliance.category}"></label>
        <select th:field="*{category}">
            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
        </select>
    </div>
    <div>
        <label th:text="#{object.appliance.model}"></label>
        <input type="text" th:field="*{model}" />
    </div>
    <div>
        <label th:text="#{object.appliance.manufacturer}"></label>
        <select th:field="*{manufacturer}">
            <option th:each="m : ${manufacturers}" th:value="${m.id}" th:text="${m.name}"></option>
        </select>
    </div>
    <div>
        <label th:text="#{object.appliance.powerType}"></label>
        <select th:field="*{powerType}">
            <option th:each="p : ${powerTypes}" th:value="${p}" th:text="${p}"></option>
        </select>
    </div>
    <div>
        <label th:text="#{object.appliance.characteristic}"></label>
        <input type="text" th:field="*{characteristic}" />
    </div>
    <div>
        <label th:text="#{object.appliance.description}"></label>
        <input type="text" th:field="*{description}" />
    </div>
    <div>
        <label th:text="#{object.appliance.power}"></label>
        <input type="text" th:field="*{power}" />
    </div>
    <div>
        <label th:text="#{object.appliance.price}"></label>
        <input type="text" th:field="*{price}" />
    </div>

    <button type="submit" class="btn btn-success" th:text="#{btn.submit}">Submit</button>
</form>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
