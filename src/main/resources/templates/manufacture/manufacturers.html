<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Manufacturers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<h1 th:text="#{manufacturer.header.list}">Manufacturer List</h1>

<table class="table table-hover">
    <thead>
    <tr class="table-dark">
        <th th:text="#{object.manufacturer.id}">ID</th>
        <th th:text="#{object.manufacturer.name}">Name</th>
        <th th:text="#{operation}">Operation</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="manufacturer : ${manufacturers}">
        <td th:text="${manufacturer.id}"></td>
        <td th:text="${manufacturer.name}"></td>
        <td>
            <a th:href="@{/manufacturers/{id}/delete(id=${manufacturer.id})}" class="btn btn-danger btn-sm">
                <i class="fa fa-trash"></i> <span th:text="#{btn.delete}">Delete</span>
            </a>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/manufacturers/add}" class="btn btn-primary" th:text="#{manufacturer.btn.new}">Add Manufacturer</a>

<div th:insert="~{footer::footer}"></div>
<p>
    <a th:href="@{/manufacturers(lang='en')}">English</a>
    <a th:href="@{/manufacturers(lang='uk')}">Українська</a>
</p>
</body>
</html>
