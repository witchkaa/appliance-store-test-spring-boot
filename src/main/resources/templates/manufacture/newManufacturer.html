<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>New Manufacturer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom-style.css" rel="stylesheet" />
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<h1 th:text="#{manufacturer.btn.new}">New Manufacturer</h1>

<form th:action="@{/manufacturers/add-manufacturer}" th:object="${manufacturer}" method="post">
    <div class="mb-3">
        <label class="form-label" th:for="name" th:text="#{object.manufacturer.name}">Name</label>
        <input class="form-control" type="text" th:field="*{name}" id="name"/>
    </div>
    <div class="btn-group">
        <button type="submit" class="btn btn-success" th:text="#{btn.submit}">Submit</button>
        <input type="reset" class="btn btn-secondary" th:value="#{btn.reset}"/>
    </div>
</form>

<div th:insert="~{footer::footer}"></div>
<p>
    <a th:href="@{/manufacturers/add(lang='en')}">English</a>
    <a th:href="@{/manufacturers/add(lang='uk')}">Українська</a>
</p>
</body>
</html>
