<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Ваша корзина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<div class="container mt-5">
    <h1>Ваша корзина</h1>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(cartItems)}">
        <p>Ваша корзина пуста.</p>
        <a href="/catalog" class="btn btn-primary">Вернуться к каталогу</a>
    </div>

    <div th:unless="${#lists.isEmpty(cartItems)}">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Товар</th>
                <th>Цена за шт.</th>
                <th>Количество</th>
                <th>Итого</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cartItems}">
                <td th:text="${item.appliance.name}">Название</td>
                <td th:text="${item.appliance.price}">0.00</td>
                <td th:text="${item.quantity}">1</td>
                <td>
                    <form th:action="@{/cart/remove}" method="post" style="display:inline;">
                        <input type="hidden" name="applianceId" th:value="${item.appliance.id}" />
                        <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <td colspan="3" class="text-end fw-bold">Общая сумма:</td>
                <td colspan="2" class="fw-bold text-success" th:text="${totalAmount} + ' $'">0.00 $</td>
            </tr>
            </tfoot>
        </table>

        <form th:action="@{/cart/checkout}" method="post">
            <button type="submit" class="btn btn-success">Оформить заказ</button>
        </form>

        <a href="/catalog" class="btn btn-secondary mt-3">Вернуться к каталогу</a>
    </div>
</div>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
