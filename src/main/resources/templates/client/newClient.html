<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>New client</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<h1 th:text="#{client.btn.new}"></h1>
<form action="#" th:action="@{add-client}" th:object="${client}" method="post">
    <p>
        <label th:text="#{object.user.name}"></label>
        <input type="text" th:field="*{name}" />
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></div>
    </p>
    <p>
        <label th:text="#{object.user.email}"></label>
        <input type="text" th:field="*{email}" />
    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></div>
    </p>
    <p>
        <label th:text="#{object.user.password}"></label>
        <input type="password" th:field="*{password}" />
    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></div>
    </p>
    <p>
        <label th:text="#{object.client.card}"></label>
        <input type="text" th:field="*{card}" />
    <div th:if="${#fields.hasErrors('card')}" th:errors="*{card}" class="text-danger"></div>
    </p>
    <p>
        <input type="submit" value="Submit" />
        <input type="reset" value="Reset" />
    </p>
</form>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
