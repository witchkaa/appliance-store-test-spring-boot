<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="/css/custom-style.css" rel="stylesheet" />
    <title>Clients list</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<h1 th:text="#{client.header.list}"></h1>
<form method="get" action="#" class="row g-2 mb-3">
    <div class="col-md-2">
        <input type="number" name="id" class="form-control" th:value="${searchId}" placeholder="ID">
    </div>
    <div class="col-md-4">
        <input type="text" name="name" class="form-control" th:value="${searchName}" placeholder="Name">
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">
            <i class="fa fa-search"></i> <span th:text="#{btn.search}">Search</span>
        </button>
    </div>
</form>
<table class="table table-hover">
    <thead>
    <tr class="table-dark">
        <th th:text="#{object.user.id}"></th>
        <th th:text="#{object.user.name}"></th>
        <th th:text="#{object.user.email}"></th>
        <th th:text="#{object.client.card}"></th>
        <th >Operation</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="client: ${clients}">
        <td th:text="${client.id}"/>
        <td th:text="${client.name}"/>
        <td th:text="${client.email}"/>
        <td th:text="${client.card}"/>
        <td>
            <a th:href="@{'/clients/' + ${client.id} + '/edit'}" class="btn btn-sm btn-warning" title="Edit">
                <i class="fa fa-edit"></i>
            </a>
            <a th:href="@{'/clients/' + ${client.id} + '/delete'}" class="btn btn-sm btn-danger" title="Delete"
               onclick="return confirm('Are you sure you want to delete this client?');">
                <i class="fa fa-minus"></i>
            </a>
        </td>
    </tr>

</tbody>
</table>
<a th:href="@{clients/add}" class="btn btn-primary" th:text="#{client.btn.new}">New client</a>
<div th:insert="~{footer::footer}"></div>
<p>
    <a th:href="@{/clients(lang='en')}">English</a>
    <a th:href="@{/clients(lang='uk')}">Українська</a>
</p>
</body>
</html>
