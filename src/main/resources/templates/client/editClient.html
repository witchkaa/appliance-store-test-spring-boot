<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{client.btn.edit}">Edit Client</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<!-- Navigation -->
<div th:insert="~{menunavy::navy}"></div>

<!-- Main Content -->
<div class="container mt-5">
    <h2 class="mb-4 text-primary" th:text="#{client.btn.edit}">Edit Client</h2>

    <form th:action="@{'/clients/' + ${client.id} + '/edit'}" th:object="${client}" method="post" class="row g-3">

        <!-- Name -->
        <div class="col-md-6">
            <label class="form-label" th:for="*{name}" th:text="#{object.user.name}">Name</label>
            <input type="text" th:field="*{name}" class="form-control" placeholder="Enter name">
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <!-- Email -->
        <div class="col-md-6">
            <label class="form-label" th:for="*{email}" th:text="#{object.user.email}">Email</label>
            <input type="email" th:field="*{email}" class="form-control" placeholder="example@mail.com">
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <!-- Password -->
        <div class="col-md-6">
            <label class="form-label" th:for="*{password}" th:text="#{object.user.password}">Password</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder=" ">
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <!-- Card -->
        <div class="col-md-6">
            <label class="form-label" th:for="*{card}" th:text="#{object.client.card}">Card</label>
            <input type="text" th:field="*{card}" class="form-control" placeholder="1234-5678">
            <div class="text-danger" th:if="${#fields.hasErrors('card')}" th:errors="*{card}"></div>
        </div>

        <!-- Buttons -->
        <div class="col-12 text-end">
            <button type="submit" class="btn btn-success me-2">
                <i class="bi bi-check-circle"></i> <span th:text="#{btn.submit}">Submit</span>
            </button>
            <button type="reset" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-counterclockwise"></i> Reset
            </button>
        </div>
    </form>

    <!-- Language Switch -->
    <div class="mt-4">
        <a th:href="@{/clients/add(lang='en')}" class="me-3">English</a>
        <a th:href="@{/clients/add(lang='uk')}">Українська</a>
    </div>
</div>

<!-- Footer -->
<div th:insert="~{footer::footer}"></div>

</body>
</html>
