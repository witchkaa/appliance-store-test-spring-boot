<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="#{verify.title}">Verify Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <h3 class="mb-4 text-center text-primary" th:text="#{verify.header}">Verify Code</h3>

    <form th:action="@{/reset/verify}" method="post">
        <input type="hidden" name="email" th:value="${email}" />

        <div class="mb-3">
            <label for="code" class="form-label" th:text="#{verify.code}">Enter Code:</label>
            <input type="text" id="code" class="form-control" name="code" required />
        </div>

        <button type="submit" class="btn btn-primary w-100" th:text="#{verify.submit}">Verify</button>

        <p th:if="${error}" class="text-danger mt-3" th:text="#{${error}}"></p>
    </form>
</div>

<div class="text-end mb-3">
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/login(lang='en')}">English</a>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/login(lang='uk')}">Українська</a>
</div>

</body>
</html>
