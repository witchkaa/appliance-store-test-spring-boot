<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="#{register.title}">Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 500px;">
    <h3 class="mb-4 text-center text-primary" th:text="#{register.header}">Client Registration</h3>

    <form th:action="@{/register}" method="post" th:object="${client}">
        <div class="mb-3">
            <label class="form-label" th:text="#{user.name}">Name</label>
            <input type="text" th:field="*{name}" class="form-control" required />
            <div class="text-danger" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{user.email}">Email</label>
            <input type="email" th:field="*{email}" class="form-control" required />
            <div class="text-danger" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{user.password}">Password</label>
            <input type="password" th:field="*{password}" class="form-control" required />
            <div class="text-danger" th:errors="*{password}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{client.card}">Card Number</label>
            <input type="text" th:field="*{card}" class="form-control" placeholder="1234-5678" required />
            <div class="text-danger" th:errors="*{card}"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100" th:text="#{register.button}">Register</button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/login}" class="btn btn-link" th:text="#{register.backToLogin}">Back to Login</a>
    </div>
</div>

</body>
</html>
