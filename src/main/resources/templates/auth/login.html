<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Password Input with Attached Show/Hide Button</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <h3 class="mb-4 text-center text-primary">Login</h3>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label" th:text="#{login.username}">Username</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus />
        </div>

        <div class="mb-3">
            <label for="password" class="form-label" th:text="#{login.password}">Password</label>
            <div class="input-group">
                <input type="password" class="form-control" id="password" name="password" required />
                <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Toggle password visibility">
                    👁️
                </button>
            </div>
        </div>

        <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.error}">Invalid credentials</div>
        <div th:if="${param.logout}" class="alert alert-info" th:text="#{login.logout}">Logged out successfully</div>

        <button type="submit" class="btn btn-primary w-100" th:text="#{login.button}">Log in</button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/reset}" class="text-decoration-none text-muted" th:text="#{login.forgot}">Forgot password?</a>
    </div>
</div>

<div class="text-end mb-3">
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/login(lang='en')}">English</a>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/login(lang='uk')}">Українська</a>
</div>

<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        const passwordInput = document.getElementById('password');
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.textContent = type === 'password' ? '👁️' : '🙈';
    });
</script>

</body>
</html>
