<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="#{reset.title}">Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/custom-style.css" rel="stylesheet" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <h3 class="mb-4 text-center text-primary" th:text="#{reset.header}">Set New Password</h3>

    <form th:action="@{/reset/new-password}" method="post" th:object="${passwordResetDto}">
        <input type="hidden" name="email" th:value="${email}" />

        <div class="mb-3">
            <label for="password" class="form-label" th:text="#{reset.newpassword}">New Password:</label>
            <div class="input-group">
                <input type="password" th:field="*{password}" id="password" class="form-control" required />
                <button type="button" class="btn btn-outline-secondary" aria-label="Toggle password visibility" id="togglePasswordBtn">
                    👁️
                </button>
            </div>
            <div th:if="${#fields.hasErrors('password')}" class="text-danger mt-1" th:errors="*{password}"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100" th:text="#{reset.submit}">Change Password</button>
    </form>
</div>

<div class="text-end mb-3">
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/login(lang='en')}">English</a>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/login(lang='uk')}">Українська</a>
</div>

<script>
    document.getElementById('togglePasswordBtn').addEventListener('click', function () {
        const passwordInput = document.getElementById('password');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            this.textContent = '🙈';
        } else {
            passwordInput.type = 'password';
            this.textContent = '👁️';
        }
    });
</script>

</body>
</html>
