<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="#{forgot.title}">Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/custom-style.css" rel="stylesheet" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <h3 class="mb-4 text-center text-primary" th:text="#{forgot.header}">Forgot Password</h3>

    <form th:action="@{/reset}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label" th:text="#{forgot.email}">Email:</label>
            <input type="email" class="form-control" id="email" name="email" required />
        </div>

        <button type="submit" class="btn btn-primary w-100" th:text="#{forgot.submit}">Send Code</button>

        <p th:if="${error}" class="text-danger mt-3" th:text="#{${error}}"></p>
        <p th:if="${info}" class="text-success mt-3" th:text="#{${info}}"></p>
    </form>
</div>

<div class="text-end mb-3">
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/login(lang='en')}">English</a>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/login(lang='uk')}">Українська</a>
</div>

</body>
</html>
