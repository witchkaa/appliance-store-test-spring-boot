<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:insert="~{menunavy::navy}"></header>
<div th:fragment="details">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title text-primary mb-3">
                <i class="bi bi-receipt"></i>
                Order #<span th:text="${order.id}">ID</span>
            </h4>

            <p><strong>Client:</strong>
                <span th:text="${order.clientName != null ? order.clientName : '—'}">—</span>
            </p>
            <p><strong>Employee:</strong>
                <span th:text="${order.employeeName != null ? order.employeeName : '—'}">—</span>
            </p>
            <p>
                <strong th:text="#{orders.field.orderDateTime}">Order Date and Time:</strong>
                <span th:if="${order.orderDateTime != null}"
                      th:text="${#temporals.format(order.orderDateTime, 'dd MMMM yyyy, HH:mm:ss')}">—</span>
                <span th:unless="${order.orderDateTime != null}">—</span>
            </p>

            <hr/>

            <h5 class="mt-4 mb-3">Ordered Items</h5>
            <table class="table table-striped table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th th:text="#{orderrow.appliance}">Appliance</th>
                    <th th:text="#{orderrow.quantity}">Qty</th>
                    <th th:text="#{orderrow.price}">Price</th>
                    <th th:text="#{orderrow.amount}">Amount</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${rows}">
                    <td>
                        <a th:if="${row.applianceName != null}"
                           th:href="@{/catalog/appliances/{id}(id=${row.applianceId})}"
                           class="text-decoration-none text-dark fw-semibold"
                           th:text="${row.applianceName}">Appliance Name</a>
                        <span th:unless="${row.applianceName != null}">—</span>
                    </td>
                    <td th:text="${row.number}">1</td>
                    <td th:text="${#numbers.formatDecimal(row.appliancePrice, 1, 'COMMA', 2, 'POINT')} + ' ₴'">100 ₴</td>
                    <td th:text="${#numbers.formatDecimal(row.amount, 1, 'COMMA', 2, 'POINT')} + ' ₴'">200 ₴</td>
                </tr>
                </tbody>
            </table>

            <div class="mt-3">
                <p class="fs-5">
                    <strong th:text="#{orders.field.amount} + ':'">Total:</strong>
                    <span th:text="${amount != null ? amount + ' ₴' : '—'}">—</span>
                </p>
            </div>
        </div>
    </div>
</div>
