<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Edit Order</title>
</head>
<body>
<header th:insert="~{menunavy::navy}"></header>
<div th:insert="~{menunavy::navy}"></div>
<main class="container mt-4">
    <h1>Edit Order</h1>

    <div th:object="${order}">
        <div class="mb-3">
            <label th:text="#{object.order.id}">Order ID</label>
            <input type="text" th:field="*{id}" class="form-control" disabled/>
        </div>
        <div class="mb-3">
            <label th:text="#{object.order.client}">Client</label>
            <input type="text" th:value="*{client.name}" class="form-control" disabled/>
        </div>
        <div class="mb-3">
            <label th:text="#{object.order.employee}">Employee</label>
            <input type="text"
                   th:value="${order.employee != null ? order.employee.name : '—'}"
                   class="form-control"
                   disabled/>
        </div>

        <table class="table table-hover mt-4">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Appliance</th>
                <th>Number</th>
                <th>Price</th>
                <th th:text="#{appliance.stock}">In Stock</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${rows}">
                <td th:text="${row.id}"></td>
                <td th:text="${row.appliance.name}"></td>
                <td th:text="${row.number}"></td>
                <td th:text="${row.amount}"></td>
                <td th:text="${row.appliance.quantityInStock}"></td>
            </tr>
            </tbody>
        </table>

        <a th:href="@{/orders/choice-appliance/{ordersId}(ordersId=${order.id})}" class="btn btn-success">
            Add Appliance <i class="fa fa-plus-square-o"></i>
        </a>
    </div>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
