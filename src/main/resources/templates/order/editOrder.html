<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/custom-style.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Edit Order</title>
</head>
<body>
<header th:insert="~{menunavy::navy}"></header>
<main class="container mt-4">
    <h1>Edit Order</h1>

    <div th:object="${order}">
        <div class="mb-3">
            <label th:text="#{object.order.id}">Order ID</label>
            <input type="text" th:field="*{id}" class="form-control" disabled/>
        </div>
        <div class="mb-3">
            <label th:text="#{object.order.client}">Client</label>
            <input type="text" th:value="*{clientName}" class="form-control" disabled/>
        </div>
        <div class="mb-3">
            <label th:text="#{object.order.employee}">Employee</label>
            <input type="text"
                   th:value="*{employeeName != null ? employeeName : '—'}"
                   class="form-control"
                   disabled/>
        </div>

        <table class="table table-hover mt-4">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th th:text="#{orderrow.appliance}">Appliance</th>
                <th th:text="#{orderrow.quantity}">Number</th>
                <th th:text="#{orderrow.price}">Price</th>
                <th th:text="#{orderrow.amount}">Amount</th>
                <th th:text="#{action.delete}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${rows}">
                <td th:text="${row.id}"></td>
                <td>
                    <a th:href="@{/catalog/appliances/{id}(id=${row.applianceId})}"
                       class="text-decoration-none fw-semibold"
                       th:text="${row.applianceName}">Appliance Name</a>
                </td>
                <td th:text="${row.number}">1</td>
                <td th:text="${#numbers.formatDecimal(row.appliancePrice, 1, 'COMMA', 2, 'POINT')} + ' ₴'">100 ₴</td>
                <td th:text="${#numbers.formatDecimal(row.amount, 1, 'COMMA', 2, 'POINT')} + ' ₴'">200 ₴</td>
                <td>
                    <a th:href="@{/orders/delete-row/{rowId}(rowId=${row.id})}"
                       class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Are you sure you want to remove this item from the order?')">
                        <i class="bi bi-trash3"></i> Delete
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <a th:href="@{/orders/choice-appliance/{ordersId}(ordersId=${order.id})}" class="btn btn-success mt-3">
            <i class="bi bi-plus-circle"></i> Add Appliance
        </a>
    </div>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
