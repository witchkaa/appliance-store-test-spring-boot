<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title th:text="#{appliance.header.list}">Appliances list</title>
</head>
<body>
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>
<main class="container mt-4">
    <h1 th:text="#{appliance.header.list}">Appliances list</h1>

    <div th:each="appliance : ${appliances}" class="mb-3 border p-3 rounded">
        <form th:action="@{/orders/add-into-order}" method="post" class="row g-2 align-items-center">
            <input type="hidden" th:name="ordersId" th:value="${ordersId}"/>
            <input type="hidden" th:name="applianceId" th:value="${appliance.id}"/>

            <div class="col-auto">
                <span th:text="${appliance.name}" class="fw-bold"></span>
            </div>
            <div class="col-auto">
                <input type="number" name="numbers" placeholder="Numbers" min="1" class="form-control" required/>
            </div>
            <div class="col-auto">
                <input type="number" step="0.01" name="price" th:value="${appliance.price}" class="form-control" required/>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary" th:text="#{orders.operation.add}">Add</button>
            </div>
        </form>
    </div>

    <a th:href="@{/orders}" class="btn btn-secondary mt-3">To Orders</a>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
