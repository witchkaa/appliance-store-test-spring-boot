<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{orders.btn.new}">New Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/custom-style.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<header th:insert="~{menunavy::navy}"></header>

<main class="container mt-4">
    <h1 th:text="#{orders.btn.new}">New Order</h1>

    <!-- Ошибка отображения -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error Message</div>

    <form th:action="@{/orders/add-order}" method="post" id="orderForm">
        <div id="applianceRows">
            <div class="row mb-3 appliance-row">
                <div class="col-md-8">
                    <label th:text="#{orderrow.appliance}">Appliance</label>
                    <select name="applianceIds" class="form-select" required>
                        <option value="" disabled selected th:text="#{orders.select.appliance}">Select appliance</option>
                        <option th:each="appliance : ${appliances}"
                                th:value="${appliance.id}"
                                th:text="${appliance.name + ' (stock: ' + appliance.quantityInStock + ')'}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label th:text="#{orderrow.quantity}">Quantity</label>
                    <input type="number" name="quantities" class="form-control" min="1" value="1" required/>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button type="button" class="btn btn-success btn-add-row">+</button>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-3" th:text="#{orders.btn.submit}">Submit Order</button>
    </form>

    <!-- Скрипт динамического добавления строк -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const applianceRows = document.getElementById('applianceRows');
            applianceRows.addEventListener('click', e => {
                if (e.target.classList.contains('btn-add-row')) {
                    const selectHTML = applianceRows.querySelector('select').innerHTML;
                    const newRow = document.createElement('div');
                    newRow.classList.add('row', 'mb-3', 'appliance-row');
                    newRow.innerHTML = `
                        <div class="col-md-8">
                            <label>Appliance</label>
                            <select name="applianceIds" class="form-select" required>
                                ${selectHTML}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label>Quantity</label>
                            <input type="number" name="quantities" class="form-control" min="1" value="1" required/>
                        </div>
                        <div class="col-md-1 d-flex align-items-end">
                            <button type="button" class="btn btn-danger btn-remove-row">−</button>
                        </div>
                    `;
                    applianceRows.appendChild(newRow);
                }
                if (e.target.classList.contains('btn-remove-row')) {
                    const row = e.target.closest('.appliance-row');
                    if (row) row.remove();
                }
            });
        });
    </script>

    <p class="mt-4">
        <a th:href="@{/orders/add(lang='en')}">English</a> |
        <a th:href="@{/orders/add(lang='uk')}">Українська</a>
    </p>
</main>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
