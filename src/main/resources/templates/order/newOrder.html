<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title th:text="#{orders.btn.new}">New Order</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<main class="container mt-4">
    <h1 th:text="#{orders.btn.new}">New Order</h1>
    <form th:action="@{/orders/add-order}" th:object="${order}" method="post">
        <div class="mb-3">
            <label for="client" class="form-label" th:text="#{object.order.client}">Client</label>
            <select id="client" class="form-select" th:field="*{client.id}" required>
                <option th:each="client : ${clients}" th:value="${client.id}" th:text="${client.name}">Client Name</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="employee" class="form-label" th:text="#{object.order.employee}">Employee</label>
            <select id="employee" class="form-select" th:field="*{employee.id}" required>
                <option th:each="employee : ${employees}" th:value="${employee.id}" th:text="${employee.name}">Employee Name</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{orders.btn.new}">Create</button>
        <input type="reset" class="btn btn-secondary" value="Reset"/>
    </form>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
