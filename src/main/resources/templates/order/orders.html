<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{orders.header.list}">Orders list</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body style="background-color: #f8f9fa">
<header th:insert="~{menunavy::navy}"></header>
<!-- Search block - only visible for EMPLOYEE -->
<div sec:authorize="hasRole('EMPLOYEE')" class="mb-4">
    <form class="row g-2" th:action="@{/orders}" method="get">
        <div class="col-md-3">
            <input type="text" name="id" class="form-control"
                   th:placeholder="#{orders.search.id}" th:value="${param.id}">
        </div>
        <div class="col-md-3">
            <input type="text" name="client" class="form-control"
                   th:placeholder="#{orders.search.client}" th:value="${param.client}">
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-search"></i> <span th:text="#{orders.search.button}">Search</span>
            </button>
        </div>
    </form>
</div>
<main class="container py-4">
    <h1 class="mb-4 text-primary" th:text="#{orders.header.list}">Orders List</h1>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle bg-white shadow-sm rounded">
            <thead class="table-primary">
            <tr>
                <th th:text="#{orders.field.id}">ID</th>
                <th th:text="#{orders.field.client}">Client</th>
                <th th:text="#{orders.field.employee}">Employee</th>
                <th th:text="#{orders.field.approved}">Approved</th>
                <th th:text="#{orders.field.operations}">Operations</th>
                <th th:text="#{orders.field.details}">Details</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders.content}">
                <td th:text="${order.id}"></td>
                <td th:text="${order.client != null ? order.client.name : '—'}"></td>
                <td th:text="${order.employee != null ? order.employee.name : '—'}"></td>
                <td>
                    <div th:if="${order.approved}">
                        <div sec:authorize="hasRole('EMPLOYEE')">
                            <a th:href="@{/orders/unapproved/{id}(id=${order.id})}" title="Unapprove">
                                <i class="bi bi-check-circle-fill text-success fs-5"></i>
                            </a>
                        </div>
                        <div sec:authorize="!hasRole('EMPLOYEE')">
                            <i class="bi bi-check-circle-fill text-success fs-5"></i>
                        </div>
                    </div>
                    <div th:unless="${order.approved}">
                        <div sec:authorize="hasRole('EMPLOYEE')">
                            <a th:href="@{/orders/approve/{id}(id=${order.id})}" title="Approve">
                                <i class="bi bi-x-circle-fill text-danger fs-5"></i>
                            </a>
                        </div>
                        <div sec:authorize="!hasRole('EMPLOYEE')">
                            <i class="bi bi-x-circle-fill text-danger fs-5"></i>
                        </div>
                    </div>
                </td>
                <td>
                    <div sec:authorize="hasRole('CLIENT')">
                        <a th:href="@{/orders/edit/{id}(id=${order.id})}" title="Edit" class="me-2">
                            <i class="bi bi-pencil-square text-primary fs-5"></i>
                        </a>
                        <a th:href="@{/orders/delete/{id}(id=${order.id})}" title="Delete"
                           onclick="return confirm('Are you sure?')">
                            <i class="bi bi-trash3-fill text-danger fs-5"></i>
                        </a>
                    </div>
                </td>
                <td>
                    <button class="btn btn-outline-info btn-sm"
                            th:onclick="'loadOrderDetails(' + ${order.id} + ')'"
                            data-bs-toggle="modal" data-bs-target="#orderDetailsModal">
                        <i class="bi bi-receipt"></i> <span th:text="#{orders.btn.details}">Details</span>
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav th:if="${orders.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${orders.first} ? 'disabled'">
                <a class="page-link" th:href="@{/orders(page=${orders.number - 1})}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
                th:classappend="${orders.number == i} ? 'active'">
                <a class="page-link" th:href="@{/orders(page=${i})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${orders.last} ? 'disabled'">
                <a class="page-link" th:href="@{/orders(page=${orders.number + 1})}" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Add button -->
    <div sec:authorize="hasRole('CLIENT')" class="mt-3 text-end">
        <a th:href="@{/orders/add}" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> <span th:text="#{orders.btn.new}">New Order</span>
        </a>
    </div>

    <!-- Language Switch -->
    <div class="mt-5 text-center">
        <a th:href="@{/orders(lang='en')}" class="me-2">🌍 English</a>
        <a th:href="@{/orders(lang='uk')}">Українська</a>
    </div>
</main>

<footer th:insert="~{footer::footer}"></footer>

<!-- Modal for order details -->
<div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" th:text="#{orders.details.header}">Order Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="orderDetailsContent">
                <!-- Здесь подгружается чек с деталями заказа -->
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function loadOrderDetails(orderId) {
        fetch('/orders/details/' + orderId)
            .then(response => response.text())
            .then(html => {
                document.getElementById('orderDetailsContent').innerHTML = html;
            });
    }
</script>

</body>
</html>
