<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Appliance Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<header th:insert="~{menunavy::navy}"></header>

<div class="container">
    <div class="text-end mb-3">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/(lang='en')}">English</a>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/(lang='uk')}">Українська</a>
    </div>

    <div class="alert alert-info" role="alert">
        <h4 class="alert-heading" th:text="#{index.welcome}">Welcome</h4>
        <p th:text="#{menu.choose}">Choose</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
