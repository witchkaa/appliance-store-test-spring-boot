<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Appliance Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="#" th:text="#{index.welcome}">Welcome</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <!-- Общие ссылки -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/orders}" th:text="#{menu.orders}">Orders</a>
                </li>

                <!-- Только для клиента -->
                <li class="nav-item" sec:authorize="hasRole('CLIENT')">
                    <a class="nav-link" th:href="@{/catalog}" th:text="#{menu.catalog}">Catalog</a>
                    <a class="nav-link" th:href="@{/cart}" th:text="#{menu.cart}">Cart</a>
                </li>

                <!-- Только для сотрудников -->
                <li class="nav-item dropdown" sec:authorize="hasRole('EMPLOYEE')">
                    <a class="nav-link dropdown-toggle" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Admin
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="adminDropdown">
                        <li><a class="dropdown-item" th:href="@{/clients}" th:text="#{menu.clients}">Clients</a></li>
                        <li><a class="dropdown-item" th:href="@{/employees}" th:text="#{menu.employees}">Employees</a></li>
                        <li><a class="dropdown-item" th:href="@{/manufacturers}" th:text="#{menu.manufacturers}">Manufacturers</a></li>
                        <li><a class="dropdown-item" th:href="@{/appliances}" th:text="#{menu.appliances}">Appliances</a></li>
                    </ul>
                </li>

                <!-- Logout -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}" th:text="#{menu.logout}">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="text-end mb-3">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/(lang='en')}">English</a>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/(lang='uk')}">Українська</a>
    </div>

    <div class="alert alert-info" role="alert">
        <h4 class="alert-heading" th:text="#{index.welcome}">Welcome</h4>
        <p>Choose an action from the menu above.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
